<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>برنامج الجماعات — الفترة الحالية</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background:#f4f6f8; margin:0; padding:24px; color:#1a1a1a; }
  .wrap { max-width:760px; margin:0 auto; background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); padding:24px; }
  .portal-header { display:flex; align-items:center; justify-content:space-between; gap:14px; padding-bottom:14px; margin-bottom:14px; border-bottom:2px solid #e5e7eb; }
  .portal-header img { height:80px; width:auto; flex-shrink:0; }
  .portal-header .title-wrap { flex:1; text-align:center; }
  .portal-header h1 { font-size:20px; margin:0; color:#1e293b; line-height:1.4; }
  .scope { text-align:center; color:#888; font-size:13px; margin-bottom:6px; }
  .clock { text-align:center; color:#1e293b; font-size:22px; font-weight:700; margin-bottom:22px; }
  .row { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:20px; justify-content:center; }
  label { display:block; font-size:13px; margin-bottom:6px; color:#444; }
  select { padding:10px 12px; border-radius:8px; border:1px solid #ccc; font-size:14px; min-width:200px; }
  button { padding:10px 20px; border-radius:8px; border:none; background:#2563eb; color:#fff; font-size:14px; cursor:pointer; }
  button.secondary { background:#64748b; }
  button:hover { background:#1d4ed8; }
  button.secondary:hover { background:#475569; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:14px; }
  th, td { border:1px solid #ddd; padding:10px; text-align:center; }
  th { background:#f0f2f5; }
  tr.now-row { background:#dcfce7; font-weight:700; }
  .empty { color:#888; padding:20px 0; text-align:center; }
  .subtitle { font-weight:600; margin-bottom:8px; }
  @media print { button, .row { display:none; } }
</style>

  const PERIOD_TIMES = ["08:00","09:15","10:30","11:45","13:00"];
  const PERIOD_DURATION = 60;
  const HOLIDAYS = {};
  const TOTAL_JAMAAT = 27;
  const DAY_NAMES_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

  const jamSelect = document.getElementById('jamSelect');
  for (let j = 1; j <= TOTAL_JAMAAT; j++) {
    const o = document.createElement('option'); o.value = j; o.textContent = 'جماعة ' + j; jamSelect.appendChild(o);
  }

  function pad(n) { return String(n).padStart(2,'0'); }
  function fmtTimeLocal(mins) { const h = Math.floor(mins/60), m = mins%60; return pad(h) + ':' + pad(m); }

  function getTodayInfo() {
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());
    const dayAr = DAY_NAMES_AR[now.getDay()];
    if (HOLIDAYS[todayStr]) return { error: 'اليوم عطلة رسمية: ' + HOLIDAYS[todayStr], date: todayStr, dayAr };
    const dayHasRecords = RECORDS.some(r => r.date === todayStr);
    if (!dayHasRecords) return { error: 'لا يوجد جدول دراسى مسجَّل لتاريخ اليوم (' + todayStr + ')', date: todayStr, dayAr };
    return { date: todayStr, dayAr };
  }

  function getCurrentPeriodInfo() {
    const today = getTodayInfo();
    if (today.error) return today;
    const now = new Date();
    const nowMins = now.getHours()*60 + now.getMinutes();
    for (let p = 1; p <= PERIOD_TIMES.length; p++) {
      const startStr = PERIOD_TIMES[p-1];
      if (!startStr) continue;
      const parts = startStr.split(':').map(Number);
      const startMins = parts[0]*60 + parts[1];
      const endMins = startMins + PERIOD_DURATION;
      if (nowMins >= startMins && nowMins < endMins) return { date: today.date, period: p, dayAr: today.dayAr };
    }
    return { error: 'لا توجد فترة دراسية جارية الآن', date: today.date, dayAr: today.dayAr };
  }

  function updateClock() {
    const now = new Date();
    const dayAr = DAY_NAMES_AR[now.getDay()];
    document.getElementById('clockLine').textContent = '📅 ' + dayAr + ' ' + now.toLocaleDateString('ar-EG') + ' — ' + now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  }

  function renderNow() {
    updateClock();
    const jam = parseInt(jamSelect.value);
    const wrap = document.getElementById('resultWrap');
    if (!jam) { wrap.innerHTML = ''; return; }
    const info = getCurrentPeriodInfo();
    if (info.error) { wrap.innerHTML = '<div class="empty">⚠️ ' + info.error + '</div>'; return; }
    const rec = RECORDS.find(r => r.date === info.date && r.period === info.period && r.jam === jam);
    if (!rec) {
      wrap.innerHTML = '<div class="empty">' + info.dayAr + ' ' + info.date + ' — الفترة ' + info.period + '<br>الجماعة ' + jam + ': لا توجد محاضرة مثبتة فى هذه الفترة.</div>';
      return;
    }
    wrap.innerHTML = '<table><thead><tr><th>اليوم</th><th>التاريخ</th><th>الفترة</th><th>المادة</th><th>اسم الموضوع</th><th>المدرس</th><th>القاعة</th></tr></thead><tbody>' +
      '<tr><td>' + info.dayAr + '</td><td>' + info.date + '</td><td>' + info.period + '</td><td>' + (rec.subject||'') + '</td><td>' + (rec.topic||'') + '</td><td>' + rec.teacher + '</td><td>' + rec.hall + '</td></tr>' +
      '</tbody></table>';
  }

  function renderTodayPeriods() {
    updateClock();
    const jam = parseInt(jamSelect.value);
    const wrap = document.getElementById('resultWrap');
    if (!jam) { wrap.innerHTML = ''; return; }
    const today = getTodayInfo();
    if (today.error) { wrap.innerHTML = '<div class="empty">⚠️ ' + today.error + '</div>'; return; }
    const currentInfo = getCurrentPeriodInfo();
    let rowsHtml = '';
    for (let p = 1; p <= PERIOD_TIMES.length; p++) {
      const startStr = PERIOD_TIMES[p-1] || '';
      let timeLabel = '';
      if (startStr) {
        const parts = startStr.split(':').map(Number);
        timeLabel = startStr + ' - ' + fmtTimeLocal(parts[0]*60 + parts[1] + PERIOD_DURATION);
      }
      const isNow = currentInfo && !currentInfo.error && currentInfo.period === p;
      const rec = RECORDS.find(r => r.date === today.date && r.period === p && r.jam === jam);
      const rowClass = isNow ? ' class="now-row"' : '';
      if (rec) {
        rowsHtml += '<tr' + rowClass + '><td>' + p + (isNow ? ' 🟢 الآن' : '') + '</td><td>' + timeLabel + '</td><td>' + (rec.subject||'') + '</td><td>' + (rec.topic||'') + '</td><td>' + rec.teacher + '</td><td>' + rec.hall + '</td></tr>';
      } else {
        rowsHtml += '<tr' + rowClass + '><td>' + p + (isNow ? ' 🟢 الآن' : '') + '</td><td>' + timeLabel + '</td><td colspan="4" style="color:#888">لا توجد محاضرة مثبتة فى هذه الفترة</td></tr>';
      }
    }
    wrap.innerHTML = '<div class="subtitle">📋 فترات ' + today.dayAr + ' ' + today.date + ' — جماعة ' + jam + '</div>' +
      '<table><thead><tr><th>الفترة</th><th>التوقيت</th><th>المادة</th><th>اسم الموضوع</th><th>المدرس</th><th>القاعة</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>';
  }

  // 🗓️ يعرض كل فترات الأسبوع الحالي (من السبت إلى الجمعة) لهذه الجماعة
  function renderWeekPeriods() {
    updateClock();
    const jam = parseInt(jamSelect.value);
    const wrap = document.getElementById('resultWrap');
    if (!jam) { wrap.innerHTML = ''; return; }
    const now = new Date();
    // بداية الأسبوع = السبت (getDay: 6 = السبت)
    const diffToSat = (now.getDay() + 1) % 7;
    const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToSat);
    const currentInfo = getCurrentPeriodInfo();
    let rowsHtml = '';
    let anyDay = false;
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i);
      const dateStr = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
      const dayAr = DAY_NAMES_AR[d.getDay()];
      if (HOLIDAYS[dateStr]) {
        rowsHtml += '<tr><td colspan="6" style="background:#fee2e2">🎌 ' + dayAr + ' ' + dateStr + ': اليوم عطلة رسمية — ' + HOLIDAYS[dateStr] + '</td></tr>';
        continue;
      }
      const dayHasRecords = RECORDS.some(r => r.date === dateStr);
      if (!dayHasRecords) continue;
      anyDay = true;
      for (let p = 1; p <= PERIOD_TIMES.length; p++) {
        const startStr = PERIOD_TIMES[p-1] || '';
        let timeLabel = '';
        if (startStr) {
          const parts = startStr.split(':').map(Number);
          timeLabel = startStr + ' - ' + fmtTimeLocal(parts[0]*60 + parts[1] + PERIOD_DURATION);
        }
        const isNow = currentInfo && !currentInfo.error && currentInfo.date === dateStr && currentInfo.period === p;
        const rec = RECORDS.find(r => r.date === dateStr && r.period === p && r.jam === jam);
        const rowClass = isNow ? ' class="now-row"' : '';
        if (rec) {
          rowsHtml += '<tr' + rowClass + '><td>' + dayAr + '<br>' + dateStr + '</td><td>' + p + (isNow ? ' 🟢 الآن' : '') + '</td><td>' + timeLabel + '</td><td>' + (rec.subject||'') + '</td><td>' + (rec.topic||'') + '</td><td>' + rec.teacher + '</td><td>' + rec.hall + '</td></tr>';
        } else {
          rowsHtml += '<tr' + rowClass + '><td>' + dayAr + '<br>' + dateStr + '</td><td>' + p + (isNow ? ' 🟢 الآن' : '') + '</td><td>' + timeLabel + '</td><td colspan="4" style="color:#888">لا توجد محاضرة مثبتة فى هذه الفترة</td></tr>';
        }
      }
    }
    if (!anyDay && !rowsHtml) {
      wrap.innerHTML = '<div class="empty">⚠️ لا يوجد جدول دراسى مسجَّل لهذا الأسبوع على هذا الجهاز</div>';
      return;
    }
    wrap.innerHTML = '<div class="subtitle">🗓️ فترات الأسبوع الحالى — جماعة ' + jam + '</div>' +
      '<table><thead><tr><th>اليوم</th><th>الفترة</th><th>التوقيت</th><th>المادة</th><th>اسم الموضوع</th><th>المدرس</th><th>القاعة</th></tr></thead><tbody>' + rowsHtml + '</tbody></table>';
  }

  // ═══════════════════════════════════════════════════════════
  // ⏰ تنبيه بالمحاضرة القادمة قبل بدئها بـ 10 دقائق
  // ═══════════════════════════════════════════════════════════
  const NOTIFY_MINUTES_BEFORE = 10;
  let _notifiedKey = null; // يمنع تكرار نفس التنبيه

  if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch(e) {}
  }

  function resetNotifyState() { _notifiedKey = null; }

  function checkUpcomingLecture() {
    const banner = document.getElementById('upcomingBanner');
    const jam = parseInt(jamSelect.value);
    if (!jam) { banner.style.display = 'none'; return; }
    const today = getTodayInfo();
    if (today.error) { banner.style.display = 'none'; return; }
    const now = new Date();
    const nowMins = now.getHours()*60 + now.getMinutes();
    for (let p = 1; p <= PERIOD_TIMES.length; p++) {
      const startStr = PERIOD_TIMES[p-1];
      if (!startStr) continue;
      const parts = startStr.split(':').map(Number);
      const startMins = parts[0]*60 + parts[1];
      const diff = startMins - nowMins;
      if (diff > 0 && diff <= NOTIFY_MINUTES_BEFORE) {
        const rec = RECORDS.find(r => r.date === today.date && r.period === p && r.jam === jam);
        if (!rec) continue;
        const notifyKey = today.date + '|' + p + '|' + jam;
        const msg = '⏰ تبدأ محاضرة "' + (rec.subject||'') + (rec.topic ? (' - ' + rec.topic) : '') + '" للجماعة ' + jam + ' بعد ' + diff + ' دقيقة (مع ' + rec.teacher + ' - ' + rec.hall + ')';
        banner.style.display = 'block';
        banner.textContent = msg;
        if (_notifiedKey !== notifyKey) {
          _notifiedKey = notifyKey;
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            try { new Notification('تنبيه محاضرة قادمة', { body: msg }); } catch(e) {}
          }
        }
        return;
      }
    }
    banner.style.display = 'none';
  }

  updateClock();
  checkUpcomingLecture();
  setInterval(function(){ updateClock(); checkUpcomingLecture(); }, 30000);
  jamSelect.selectedIndex = 0;
  renderNow();
</script>
</body>
</html>
